# A free Supabase project pauses after a week without activity, and then nobody can sign in to the site.
# This reads one row through the public API every three days so the project stays awake.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(jq -r .supabase_url config.json)
          KEY=$(jq -r .supabase_anon_key config.json)
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/members?select=email&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
