<!doctype html>
<html lang="he" dir="rtl" data-page="tasks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משימות</title>
<style>
/*COMMON_CSS*/
main{max-width:1180px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;line-height:1.2;color:var(--accent)}
.stat b.bad{color:var(--no)}
.stat span{font-size:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 6px}
.toolbar select{font:inherit;font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--radius);padding:10px 10px 4px;min-height:120px}
.col h3{font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.col h3 span{font-size:13px;color:var(--muted);font-weight:500}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin:0 0 8px;box-shadow:var(--shadow)}
.tcard.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border)}
.tt{font-weight:600;line-height:1.45}
.tm{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--muted);margin-top:5px;align-items:center}
.tb{font-size:14px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
.trow{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.move{display:flex;gap:4px}
.move button{font:inherit;font-size:12.5px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:1px 8px;cursor:pointer}
.move button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:820px){.board{grid-template-columns:1fr}}
@media print{.board{grid-template-columns:repeat(3,1fr)}.move,.icon-act{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">פרויקט גמר · ForSight Robotics</div>
  <nav class="tabs">
    <!--NAV-->
  </nav>
  <button class="btn" id="printBtn" type="button">הדפסה</button>
  <button class="btn" id="themeBtn" type="button" aria-label="מצב כהה או בהיר">◐</button>
</div>

<main>
<header class="doc">
  <h1>משימות</h1>
  <p class="sub">מי עושה מה, ועד מתי</p>
  <p class="meta">כל משימה משויכת לאחראי ולאבן דרך. ההתקדמות מוצגת גם בטיימליין.</p>
</header>

<div class="callout warn gate" id="gate" hidden></div>
<p class="live-off">המשימות גלויות רק לצוות. מתחברים עם הכפתור "התחברות" למעלה.</p>

<div class="live-on">
  <div class="stats" id="stats"></div>
  <form class="iform no-print" id="form"></form>
  <div class="toolbar no-print">
    <div class="chips" id="owners">
      <button type="button" data-o="all" aria-pressed="true">כולם</button>
      <button type="button" data-o="נועם" aria-pressed="false">נועם</button>
      <button type="button" data-o="עמרי" aria-pressed="false">עמרי</button>
      <button type="button" data-o="לא נקבע" aria-pressed="false">בלי אחראי</button>
    </div>
    <label class="small muted">אבן דרך <select id="msFilter"></select></label>
  </div>
  <div class="board" id="board"></div>
</div>
</main>

<script>
/*COMMON_JS*/

(function(){
  var esc=fsEsc;
  var MS=[['visit','יום האפיון'],['orientation','מצגת אוריינטציה'],['semA','מצגת סמסטר א׳'],['org','הצגה לארגון'],['interim','דוח ביניים'],['poster','פוסטר'],['semB','מצגת סמסטר ב׳'],['final','דוח מסכם'],['handover','מסירה לארגון']];
  var msName={}; MS.forEach(function(m){msName[m[0]]=m[1]});
  var OWNERS=['לא נקבע','נועם','עמרי','שנינו'];
  var COLS=[['open','לעשות'],['doing','בעבודה'],['done','הושלם']];
  var rows=[], filt={owner:'all',ms:''};
  var form=document.getElementById('form');

  var opt=function(v,t){return '<option value="'+esc(v)+'">'+esc(t)+'</option>'};
  form.innerHTML=
    '<label class="wide">משימה חדשה<input name="title" required placeholder="מה צריך לעשות"></label>'+
    '<label>אחראי<select name="owner">'+OWNERS.map(function(o){return opt(o,o)}).join('')+'</select></label>'+
    '<label>תאריך יעד<input type="date" name="due"></label>'+
    '<label>אבן דרך<select name="milestone">'+opt('','—')+MS.map(function(m){return opt(m[0],m[1])}).join('')+'</select></label>'+
    '<label class="wide">פרטים (לא חובה)<textarea name="body" rows="2" style="min-height:56px"></textarea></label>'+
    '<div class="actions"><button class="btn primary" type="submit">הוספה</button><button class="btn" type="button" id="cancel" hidden>ביטול עריכה</button></div>';
  document.getElementById('msFilter').innerHTML=opt('','הכול')+MS.map(function(m){return opt(m[0],m[1])}).join('');

  var api=fsItems(['task'],function(d){rows=d;render()},document.getElementById('gate'));

  function reset(){form.reset();form.removeAttribute('data-id');form.classList.remove('editing');form.querySelector('[type=submit]').textContent='הוספה';document.getElementById('cancel').hidden=true}
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var rec={title:form.elements.title.value.trim(),owner:form.elements.owner.value,due:form.elements.due.value||null,milestone:form.elements.milestone.value||null,body:form.elements.body.value.trim()||null};
    if(!rec.title) return;
    api.save('task',rec,form.getAttribute('data-id')).then(reset);
  });
  document.getElementById('cancel').onclick=reset;

  function edit(t){
    form.elements.title.value=t.title||''; form.elements.owner.value=t.owner||'לא נקבע'; form.elements.due.value=t.due||''; form.elements.milestone.value=t.milestone||''; form.elements.body.value=t.body||'';
    form.setAttribute('data-id',t.id); form.classList.add('editing');
    form.querySelector('[type=submit]').textContent='שמירת השינויים'; document.getElementById('cancel').hidden=false;
    form.scrollIntoView({block:'center'}); form.elements.title.focus();
  }

  function visible(t){
    var o=filt.owner, okOwner=o==='all'||t.owner===o||(t.owner==='שנינו'&&(o==='נועם'||o==='עמרי'))||(o==='לא נקבע'&&(!t.owner||t.owner==='לא נקבע'));
    return okOwner&&(!filt.ms||t.milestone===filt.ms);
  }
  function card(t,ci){
    var today=fsToday(), late=t.status!=='done'&&t.due&&t.due<today;
    var prev=ci>0?'<button type="button" data-move="'+COLS[ci-1][0]+'" data-id="'+t.id+'" title="חזרה ל'+COLS[ci-1][1]+'">→ '+COLS[ci-1][1]+'</button>':'';
    var next=ci<2?'<button type="button" data-move="'+COLS[ci+1][0]+'" data-id="'+t.id+'" title="העברה ל'+COLS[ci+1][1]+'">'+COLS[ci+1][1]+' ←</button>':'';
    return '<div class="tcard'+(t.status==='done'?' done':'')+'"><div class="tt">'+esc(t.title)+'</div>'+
      '<div class="tm"><span class="badge'+(t.owner&&t.owner!=='לא נקבע'?' graded':'')+'">'+esc(t.owner||'לא נקבע')+'</span>'+
      (t.due?'<span class="'+(late?'late':'')+'">'+(late?'באיחור · ':'עד ')+fsDate(t.due)+'</span>':'')+
      (t.milestone?'<span>· '+esc(msName[t.milestone]||t.milestone)+'</span>':'')+'</div>'+
      (t.body?'<div class="tb">'+esc(t.body)+'</div>':'')+
      '<div class="trow"><div class="move no-print">'+prev+next+'</div><div class="icon-act no-print"><button type="button" data-edit="'+t.id+'" title="עריכה">✎</button><button type="button" data-del="'+t.id+'" title="מחיקה">×</button></div></div></div>';
  }
  function render(){
    var today=fsToday(), me=api.who();
    var open=rows.filter(function(t){return t.status!=='done'});
    var late=open.filter(function(t){return t.due&&t.due<today}).length;
    var mine=open.filter(function(t){return t.owner===me||t.owner==='שנינו'}).length;
    document.getElementById('stats').innerHTML=
      '<div class="stat"><b>'+open.length+'</b><span>פתוחות</span></div>'+
      '<div class="stat"><b>'+rows.filter(function(t){return t.status==='doing'}).length+'</b><span>בעבודה</span></div>'+
      '<div class="stat"><b class="'+(late?'bad':'')+'">'+late+'</b><span>באיחור</span></div>'+
      '<div class="stat"><b>'+mine+'</b><span>פתוחות שלך'+(me?' ('+esc(me)+')':'')+'</span></div>';
    document.getElementById('board').innerHTML=COLS.map(function(c,ci){
      var list=rows.filter(function(t){return (t.status||'open')===c[0]&&visible(t)});
      list.sort(c[0]==='done'?function(a,b){return a.updated_at<b.updated_at?1:-1}:function(a,b){var x=a.due||'9999',y=b.due||'9999';return x<y?-1:x>y?1:(a.created_at<b.created_at?-1:1)});
      return '<div class="col"><h3>'+c[1]+'<span>'+list.length+'</span></h3>'+(list.length?list.map(function(t){return card(t,ci)}).join(''):'<p class="empty">אין כאן משימות.</p>')+'</div>';
    }).join('');
  }
  function find(id){for(var i=0;i<rows.length;i++)if(rows[i].id===id)return rows[i]}
  document.getElementById('board').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||!api.ok()) return;
    if(b.dataset.move) api.save('task',{status:b.dataset.move},b.dataset.id);
    else if(b.dataset.edit) edit(find(b.dataset.edit));
    else if(b.dataset.del&&confirm('למחוק את המשימה?')) api.remove(b.dataset.del);
  });
  document.getElementById('owners').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    this.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    filt.owner=b.dataset.o; render();
  });
  document.getElementById('msFilter').onchange=function(){filt.ms=this.value;render()};
})();
</script>
</body>
</html>
